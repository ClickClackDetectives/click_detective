[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "click-detective"
version = "0.1.0"
description = "FastAPI investigation engine and quantized Qwen LangGraph dialogue"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "langgraph>=1,<2"]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "transformers>=4.51,<5", "accelerate>=1,<2", "bitsandbytes>=0.45,<1", "peft>=0.15,<1", "click-detective[retrieval]"]
retrieval = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "chromadb>=1.5.9,<1.6",
    "kiwipiepy>=0.23.2,<0.24",
    "bm25s>=0.3.16,<0.4",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
